{% load wagtailcore_tags %}{# JSON-LD BlogPosting + BreadcrumbList #}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BlogPosting",
      "@id": "{{ request.build_absolute_uri }}#post",
      "mainEntityOfPage": "{{ request.build_absolute_uri }}",
      "headline": "{{ page.title|escapejs }}",
      "description": "{{ page.search_description|default:page.intro|escapejs }}",
      "datePublished": "{{ page.first_published_at|date:'c' }}",
      "dateModified": "{{ page.last_published_at|date:'c' }}",
      {% if page.cover_image %}"image": "{{ request.scheme }}://{{ request.get_host }}{{ page.cover_image.file.url }}",{% endif %}
      "author": {
        "@type": "Person",
        "name": "{% if page.author %}{{ page.author.name|escapejs }}{% else %}{{ SITE_NAME|escapejs }}{% endif %}"
      },
      "publisher": {
        "@type": "Organization",
        "name": "{{ SITE_NAME|escapejs }}"
      }
      {% if page.category %},"articleSection": "{{ page.category.name|escapejs }}"{% endif %}
    },
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "{{ SITE_NAME|escapejs }}", "item": "{{ request.scheme }}://{{ request.get_host }}/"},
        {"@type": "ListItem", "position": 2, "name": "Blog", "item": "{{ request.scheme }}://{{ request.get_host }}/blog/"},
        {"@type": "ListItem", "position": 3, "name": "{{ page.title|escapejs }}"}
      ]
    }
  ]
}
</script>
